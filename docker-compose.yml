services:
  db:
    image: postgres:16-alpine
    container_name: passgen-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-passgen}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-passgen_secret}
      POSTGRES_DB: ${POSTGRES_DB:-passgen}
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./db/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-passgen} -d ${POSTGRES_DB:-passgen}"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s
    networks:
      - appnet

  backend:
    build: ./backend
    container_name: passgen-backend
    restart: unless-stopped
    environment:
      POSTGRES_HOST: db
      POSTGRES_PORT: 5432
      POSTGRES_USER: ${POSTGRES_USER:-passgen}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-passgen_secret}
      POSTGRES_DB: ${POSTGRES_DB:-passgen}
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "${BACKEND_PORT:-8000}:8000"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/health', timeout=3)"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s
    networks:
      - appnet

  frontend:
    build: ./frontend
    container_name: passgen-frontend
    restart: unless-stopped
    depends_on:
      backend:
        condition: service_healthy
    ports:
      - "${FRONTEND_PORT:-8080}:80"
    networks:
      - appnet

volumes:
  pgdata:

networks:
  appnet:
    driver: bridge
